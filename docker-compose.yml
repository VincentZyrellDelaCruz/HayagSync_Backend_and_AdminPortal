services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: hayagsync-app
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
      - ./seed_media:/seed_media
    depends_on:
      redis:
        condition: service_started
    networks:
      - hayagsync

  nginx:
    image: nginx:1.27-alpine
    container_name: hayagsync-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./certs:/etc/nginx/certs
    depends_on:
      - app
    networks:
      - hayagsync

  redis:
    image: redis:7-alpine
    container_name: hayagsync-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hayagsync

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: hayagsync-queue
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    volumes:
      - ./src:/var/www/html
    depends_on:
      - app
      - redis
    networks:
      - hayagsync

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: hayagsync-reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=6001
    ports:
      - "6001:6001"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - app
      - redis
    networks:
      - hayagsync

  node:
    image: node:22-alpine
    container_name: hayagsync-node
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./src:/var/www/html
    ports:
      - "5173:5173"
    networks:
      - hayagsync

volumes:
  redis_data:

networks:
  hayagsync:
    driver: bridge
